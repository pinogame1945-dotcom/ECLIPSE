name: ECLIPSE immutable PRIVATE Kaggle vendor V3 and independent readback
on:
  push:
    branches: [feature/vendor-source-registry-20261010]
    paths:
      - '.github/workflows/vendor-kaggle-v3.yml'
      - 'src/eclipse_l0/vendor_kaggle_v3.py'
      - 'tests/test_vendor_kaggle_v3.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eclipse-vendor-private-v3-create-once
  cancel-in-progress: false
jobs:
  immutable-v3-create:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline immutable chain / tampering tests
        run: |
          python -m eclipse_l0.vendor_registry
          python -m unittest discover -s tests -p test_vendor_kaggle_v3.py -v
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - name: Recover V1 and V2 trusted PREUPLOAD indices (not from Kaggle)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 2; }
          mkdir -p "$RUNNER_TEMP/v3-trust1" "$RUNNER_TEMP/v3-trust2" trusted
          gh run download 38052640331 --repo "$GITHUB_REPOSITORY" --name eclipse-vendor-kaggle-trusted-source-index --dir "$RUNNER_TEMP/v3-trust1"
          gh run download 38053669895 --repo "$GITHUB_REPOSITORY" --name eclipse-vendor-v2-trusted-preupload-index --dir "$RUNNER_TEMP/v3-trust2"
          mapfile -t prior < <(find "$RUNNER_TEMP/v3-trust1" -name vendor-evidence-index.json -type f)
          mapfile -t latest < <(find "$RUNNER_TEMP/v3-trust2" -name vendor-evidence-v2-index.json -type f)
          test "${#prior[@]}" -eq 1 && test "${#latest[@]}" -eq 1 || { echo "::error::Cannot verify V2 ancestry"; exit 3; }
          cp "${prior[0]}" trusted/v1.json
          cp "${latest[0]}" trusted/v2.json
          python - <<'PY'
          from pathlib import Path
          from eclipse_l0.vendor_kaggle_v3 import trusted_parent
          x=trusted_parent(Path('trusted/v2.json'),Path('trusted/v1.json'))
          print("V1_TO_V2_PREUPLOAD_ANCESTRY_TRUSTED",x["counts"])
          PY
      - name: Independently recover authentic Kaggle PRIVATE V2 as immutable parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-identity" "$RUNNER_TEMP/v3-down-v2" "$RUNNER_TEMP/v3-stage"
          kaggle datasets init -p "$RUNNER_TEMP/v3-identity" >/dev/null
          ref="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v3-identity/dataset-metadata.json'
          v=json.loads(p.read_text())['id']
          if not isinstance(v,str) or not v.endswith('/INSERT_SLUG_HERE'):raise SystemExit('Unexpected Kaggle owner')
          print(v.replace('INSERT_SLUG_HERE','eclipse-vendor-evidence-20261010-v2'))
          PY
          )"
          echo "::add-mask::$ref"
          for name in vendor-evidence-v2-index.json part-0000.dbpart; do
            ok=0
            for i in 1 2 3; do
              if kaggle datasets download "$ref" --file "$name" --path "$RUNNER_TEMP/v3-down-v2" --unzip --force --quiet >/dev/null 2>&1 \
                 && test -s "$RUNNER_TEMP/v3-down-v2/$name"; then ok=1;break;fi
              sleep 3
            done
            test "$ok" -eq 1 || exit 4
          done
          python -m eclipse_l0.vendor_kaggle_successor restore \
             --trusted-index trusted/v2.json --parent-index trusted/v1.json \
             --downloaded "$RUNNER_TEMP/v3-down-v2" --dest "$RUNNER_TEMP/v3-parent.sqlite3" \
             --registry config/vendor_source_registry.json > "$RUNNER_TEMP/v3-parent-proof.json"
          cp "$RUNNER_TEMP/v3-parent.sqlite3" "$RUNNER_TEMP/v3-child.sqlite3"
      - name: Bounded one-shot capture of 15 new official sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from eclipse_l0.vendor_pilot import run
          from eclipse_l0.vendor_registry import load_registry
          from eclipse_l0.vendor_kaggle_v3 import EXPECTED_SOURCE_IDS
          temp=Path(os.environ["RUNNER_TEMP"])
          r=run(registry=load_registry(Path("config/vendor_source_registry.json")),
                db_path=temp/"v3-child.sqlite3",source_ids=list(EXPECTED_SOURCE_IDS),max_items=1)
          (temp/"v3-collection-manifest.json").write_text(json.dumps(r,indent=2,ensure_ascii=False)+"\n")
          print({"attempted":len(EXPECTED_SOURCE_IDS),"pass":r["sources_pass"],
                 "fail":r["sources_failed"],"partial":r["sources_partial"],
                 "failed_sources":[x["source_id"] for x in r["source_results"] if x["status"]!="PASS"],
                 "counts":r["db_counts"]})
          PY
          python -m eclipse_l0.vendor_kaggle_v3 stage \
            --parent-db "$RUNNER_TEMP/v3-parent.sqlite3" --child-db "$RUNNER_TEMP/v3-child.sqlite3" \
            --v2-index trusted/v2.json --v1-index trusted/v1.json \
            --collection-manifest "$RUNNER_TEMP/v3-collection-manifest.json" \
            --dest "$RUNNER_TEMP/v3-stage" \
            --registry config/vendor_source_registry.json > "$RUNNER_TEMP/v3-staging-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"v3-staging-receipt.json").read_text())
          print("STAGED_V3_UNREVIEWED",r["counts"],r["sampling"]["passed"],"sources")
          PY
      - name: Create NEW PRIVATE Kaggle V3; refuse overwrite even on retries
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v3-stage"
          kaggle datasets init -p "$stage" >/dev/null
          ref="$(python - "$stage" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])/'dataset-metadata.json'
          m=json.loads(p.read_text());old=m.get('id','')
          if not isinstance(old,str) or not old.endswith('/INSERT_SLUG_HERE'):raise SystemExit('Unexpected Kaggle owner')
          ref=old.replace('INSERT_SLUG_HERE','eclipse-vendor-evidence-20261010-v3')
          m.update(id=ref,title="ECLIPSE Vendor PRIVATE Evidence Generation 3",
            description="Append-only PRIVATE vendor observations; v1/v2 retained; no customer records or raw vendor publisher bodies.",
            licenses=[{'name':'other'}])
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n");print(ref)
          PY
          )"
          echo "::add-mask::$ref"
          if kaggle datasets status "$ref" >/dev/null 2>&1;then
            echo "::error::V3 already exists; never overwrite";exit 5
          fi
          kaggle datasets create -p "$stage" --quiet --keep-tabular --dir-mode skip >/dev/null 2>&1 || {
            echo "::error::Kaggle V3 private create failed; no existing datasets will be overwritten";exit 6;
          }
          echo "PRIVATE_V3_DATASET_CREATED"
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-vendor-v3-preupload-trust
          path: |
            ${{ runner.temp }}/v3-stage/vendor-evidence-v3-index.json
            ${{ runner.temp }}/v3-staging-receipt.json
          retention-days: 7
          if-no-files-found: error

  independent-v3-readback:
    needs: immutable-v3-create
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-vendor-v3-preupload-trust
          path: trusted/v3
      - name: Retrieve original independent ancestor indices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted/v1-source trusted/v2-source
          gh run download 38052640331 --repo "$GITHUB_REPOSITORY" --name eclipse-vendor-kaggle-trusted-source-index --dir trusted/v1-source
          gh run download 38053669895 --repo "$GITHUB_REPOSITORY" --name eclipse-vendor-v2-trusted-preupload-index --dir trusted/v2-source
          mapfile -t f1 < <(find trusted/v1-source -name vendor-evidence-index.json -type f)
          mapfile -t f2 < <(find trusted/v2-source -name vendor-evidence-v2-index.json -type f)
          mapfile -t f3 < <(find trusted/v3 -name vendor-evidence-v3-index.json -type f)
          test "${#f1[@]}" -eq 1 && test "${#f2[@]}" -eq 1 && test "${#f3[@]}" -eq 1 || exit 2
          cp "${f1[0]}" trusted/v1.json
          cp "${f2[0]}" trusted/v2.json
          cp "${f3[0]}" trusted/v3.json
          python - <<'PY'
          import json
          from pathlib import Path
          from eclipse_l0.vendor_kaggle_v3 import validate_index
          i=json.loads(Path("trusted/v3.json").read_text())
          validate_index(i,Path("trusted/v2.json"),Path("trusted/v1.json"))
          print("V3_ORIGINAL_PREUPLOAD_DIGEST_AND_ANCESTRY_VERIFIED",i["counts"])
          PY
      - name: Download private V3 onto DIFFERENT GitHub runner; verify SHA + SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-identity" "$RUNNER_TEMP/v3-downloaded"
          kaggle datasets init -p "$RUNNER_TEMP/v3-identity" >/dev/null
          ref="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"v3-identity/dataset-metadata.json"
          x=json.loads(p.read_text())["id"]
          if not isinstance(x,str) or not x.endswith("/INSERT_SLUG_HERE"):raise SystemExit("Unexpected owner")
          print(x.replace("INSERT_SLUG_HERE","eclipse-vendor-evidence-20261010-v3"))
          PY
          )"
          echo "::add-mask::$ref"
          for name in vendor-evidence-v3-index.json part-0000.dbpart;do
            ok=0
            for i in 1 2 3;do
              if kaggle datasets download "$ref" --file "$name" --path "$RUNNER_TEMP/v3-downloaded" \
                 --unzip --force --quiet >/dev/null 2>&1 && test -s "$RUNNER_TEMP/v3-downloaded/$name";then ok=1;break;fi
              sleep 4
            done
            test "$ok" -eq 1 || exit 5
          done
          python -m eclipse_l0.vendor_kaggle_v3 restore \
            --trusted-index trusted/v3.json --v2-index trusted/v2.json --v1-index trusted/v1.json \
            --downloaded "$RUNNER_TEMP/v3-downloaded" \
            --dest "$RUNNER_TEMP/v3-verified.sqlite3" \
            --registry config/vendor_source_registry.json > "$RUNNER_TEMP/v3-independent-receipt.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'v3-independent-receipt.json').read_text())
          assert r["result"]=="PRIVATE_VENDOR_V3_INDEPENDENT_READBACK_VERIFIED"
          assert r["sqlite_integrity"]=="ok"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as output:
              output.write("## Kaggle PRIVATE V3 independently restored\n")
              output.write(f"- Documents: **{r['counts']['advisories']}**; versions: **{r['counts']['versions']}**\n")
              output.write(f"- Sample sources passed: **{r['new_sources_passed']}**; explicit failed: **{len(r['failures_not_hidden'])}**\n")
              output.write("- V1/V2/CVE warehouses untouched; coverage and product-version claims not approved.\n")
          print('INDEPENDENT_PRIVATE_VENDOR_V3_READBACK_PASS',r['counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-vendor-v3-independent-receipt
          path: ${{ runner.temp }}/v3-independent-receipt.json
          retention-days: 7
          if-no-files-found: warn
