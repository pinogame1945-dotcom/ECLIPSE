name: ECLIPSE independently verify existing PRIVATE vendor Kaggle dataset

# Recover after original successful Kaggle CREATE but failed proof-path packaging.
# NO dataset create/version/delete; only read from the exact pinned PRIVATE dataset.
on:
  push:
    branches: [feature/vendor-source-registry-20261010]
    paths:
      - .github/workflows/vendor-kaggle-verify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fresh-runner-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - name: Retrieve independent original PRE-upload trusted source index
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::No Kaggle credential"; exit 2; }
          mkdir -p "$RUNNER_TEMP/ecl-trusted-artifact" trusted
          gh run download 38052640331 --repo "$GITHUB_REPOSITORY" \
            --name eclipse-vendor-kaggle-trusted-source-index \
            --dir "$RUNNER_TEMP/ecl-trusted-artifact"
          mapfile -t found < <(find "$RUNNER_TEMP/ecl-trusted-artifact" \
            -type f -name vendor-evidence-index.json)
          test "${#found[@]}" -eq 1 || { echo "::error::Original trusted index missing/ambiguous"; exit 3; }
          cp "${found[0]}" trusted/vendor-evidence-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          from eclipse_l0.vendor_kaggle import validate_index,EXPECTED_SOURCE_DIGEST
          idx=json.loads(Path('trusted/vendor-evidence-index.json').read_text())
          validate_index(idx)
          assert idx['sqlite_sha256']==EXPECTED_SOURCE_DIGEST
          print('TRUSTED_INDEX_PINNED_FROM_PRE_UPLOAD_GITHUB_ARTIFACT=YES')
          PY
      - name: Download exact Kaggle files to a new independent runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecl-id" "$RUNNER_TEMP/ecl-vendor-downloaded"
          kaggle datasets init -p "$RUNNER_TEMP/ecl-id" >/dev/null
          ref="$(python - <<'PY'
          import json,os
          from pathlib import Path
          meta=json.loads((Path(os.environ['RUNNER_TEMP'])/'ecl-id/dataset-metadata.json').read_text())
          template=meta.get('id','')
          if not isinstance(template,str) or not template.endswith('/INSERT_SLUG_HERE'):
              raise SystemExit('Unexpected private Kaggle account')
          print(template.replace('INSERT_SLUG_HERE','eclipse-vendor-evidence-20261010-v1'))
          PY
          )"
          echo "::add-mask::$ref"
          for name in vendor-evidence-index.json part-0000.dbpart; do
            ok=0
            for attempt in 1 2 3; do
              if kaggle datasets download "$ref" --file "$name" \
                 --path "$RUNNER_TEMP/ecl-vendor-downloaded" --unzip --force --quiet >/dev/null 2>&1 \
                 && test -s "$RUNNER_TEMP/ecl-vendor-downloaded/$name"; then
                ok=1
                break
              fi
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Kaggle missing required private dataset file $name"
              exit 7
            fi
          done
          python -m eclipse_l0.vendor_kaggle restore \
             --trusted-index trusted/vendor-evidence-index.json \
             --downloaded "$RUNNER_TEMP/ecl-vendor-downloaded" \
             --out "$RUNNER_TEMP/independently-restored-vendor.sqlite3" \
             --registry config/vendor_source_registry.json \
             > "$RUNNER_TEMP/vendor-independent-readback-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads((Path(os.environ['RUNNER_TEMP'])/'vendor-independent-readback-receipt.json').read_text())
          assert receipt['result']=='INDEPENDENT_PRIVATE_KAGGLE_VENDOR_SQLITE_RESTORE_VERIFIED'
          assert receipt['counts']=={'advisories':125,'versions':202,'events':202}
          assert receipt['sqlite_quick_check']=='ok'
          assert receipt['cve_warehouse_untouched']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## PRIVATE Kaggle vendor archive: independent restore VERIFIED\n')
              out.write('- 125 official vendor documents, 202 audit versions/events, 9 sources.\n')
              out.write('- Byte-for-byte SHA256 from pre-upload GitHub trusted index; SQLite quick_check OK.\n')
              out.write('- CVE/KEV/EPSS warehouse never modified. Extracted vendor facts remain UNREVIEWED.\n')
          print('PRIVATE_VENDOR_KAGGLE_INDEPENDENT_RESTORE=VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-vendor-kaggle-verified-readback-receipt
          path: ${{ runner.temp }}/vendor-independent-readback-receipt.json
          retention-days: 7
          if-no-files-found: warn
