name: ECLIPSE one-shot customer PRODUCT briefing - FICTIONAL demo only

# This workflow must NEVER accept inventory input/paths from real customers.
# Public repo + Actions artifacts are not an approved client-data boundary.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-demo-customer-product-report.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eclipse-customer-product-fictional-demo
  cancel-in-progress: false

jobs:
  fictional-product-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (customer matching and PPTX)
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_customer_product_report.py' -v
      - name: Kaggle CLI for EXISTING pinned private warehouse only
        run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-warehouse-trusted-receipts
          path: trusted
          run-id: 38050051810
          github-token: ${{ github.token }}
      - name: Verify receipt + run local customer report against reconstructed original SQLite
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo '::error::Kaggle token missing';exit 2; }
          echo '2b86adb90258a5b2cc196dfcb0598977d802324c0c98642d133ca63efad39aa9  trusted/upload/warehouse-index.json' | sha256sum -c -
          available="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$available" -ge 6291456 || { echo '::error::Less than 6GiB free disk';exit 3; }
          mkdir -p "$RUNNER_TEMP/ecl-demo-identity" "$RUNNER_TEMP/ecl-demo-recover/parts" "$RUNNER_TEMP/ecl-demo-out"
          kaggle datasets init -p "$RUNNER_TEMP/ecl-demo-identity" >/dev/null
          dataset_ref="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ecl-demo-identity/dataset-metadata.json'
          template=json.loads(p.read_text())['id']
          if not isinstance(template,str) or not template.endswith('/INSERT_SLUG_HERE'):
              raise SystemExit('Unexpected Kaggle identity')
          print(template.replace('INSERT_SLUG_HERE','eclipse-cve-warehouse-20261010-v1'))
          PY
          )"
          echo "::add-mask::$dataset_ref"
          python -m eclipse_l0.warehouse restore \
            --trusted-index trusted/upload/warehouse-index.json \
            --dataset-ref "$dataset_ref" \
            --parts-dir "$RUNNER_TEMP/ecl-demo-recover/parts" \
            --out "$RUNNER_TEMP/ecl-demo-recover/warehouse.sqlite3" \
            > "$RUNNER_TEMP/ecl-demo-recover/restore.log"
          echo 'FULL_WAREHOUSE_RESTORED_FROM_IMMUTABLE_PRIVATE_KAGGLE=YES'
          python -m eclipse_reports.customer_products \
            --db "$RUNNER_TEMP/ecl-demo-recover/warehouse.sqlite3" \
            --inventory config/SYNTHETIC-product-inventory-example.json \
            --out-dir "$RUNNER_TEMP/ecl-demo-out" \
            --as-of 2026-10-10 \
            --days 90 --mode recent --demo
          python -m eclipse_reports.customer_product_slides \
            --report-json "$RUNNER_TEMP/ecl-demo-out/customer-product-report.json" \
            --out "$RUNNER_TEMP/ecl-demo-out/customer-product-report.pptx"
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          from pptx import Presentation
          root=Path(os.environ['RUNNER_TEMP'])/'ecl-demo-out'
          p=json.loads((root/'customer-product-report.json').read_text())
          assert p['synthetic_demo'] is True
          assert p['classification']=='CUSTOMER_PRODUCT_REFERENCE_REPORT_NOT_VERIFIED_ASSET_EXPOSURE'
          assert p['summary']['monitored_inventory_entries']==3
          assert len(p['preview'])<=120
          assert p['provenance']['CVE_index_sha256']=='1b19b50fedb034390463a68222948b365f6b6dc39dcd1904218dd880abe504d2'
          with (root/'candidate-vulnerabilities.csv').open(encoding='utf-8-sig',newline='') as f:
              n=sum(1 for _ in csv.DictReader(f))
          assert n==p['summary']['product_cve_rows_in_report']
          prs=Presentation(root/'customer-product-report.pptx')
          assert len(prs.slides)>=5
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## ECLIPSE customer-product CVE demo (fictional profile only)\n\n')
              f.write(f"- Products: {p['summary']['monitored_inventory_entries']}\n")
              f.write(f"- Full CSV product-CVE rows: {n}\n")
              f.write(f"- KEV matching product-CVE rows: {p['summary']['kev_listed_product_cve_rows']}\n")
              f.write(f"- Editable PowerPoint: {len(prs.slides)} slides\n")
              f.write('- Customer exposure/installed-version impact: NOT ASSESSED.\n')
              f.write('- Real customer profiles NEVER permitted in this public CI pipeline.\n')
          print('FICTIONAL_CUSTOMER_PRODUCT_REPORT_GENERATED_AND_VERIFIED=YES')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-fictional-customer-product-report-json-csv-pptx
          path: ${{ runner.temp }}/ecl-demo-out/
          retention-days: 7
          if-no-files-found: warn
