name: ECLIPSE vendor sources batch live verification (read-only)

on:
  push:
    branches:
      - verify/vendor-source-batch-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile probe before making network requests
        run: python -m py_compile experiments/vendor_batch_probe.py
      - name: Test Microsoft Red Hat Palo Alto Siemens Yamaha official sources
        run: python experiments/vendor_batch_probe.py --out output/vendor-validation.json
      - name: Upload inspection manifest (never production state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-source-batch-evidence
          path: output/vendor-validation.json
          if-no-files-found: warn
          retention-days: 7
