name: ECLIPSE enterprise batch2 official six-source probe
on:
  push:
    branches: [feature/vendor-source-registry-20261010]
    paths:
      - 'src/eclipse_l0/vendor_enterprise_batch.py'
      - 'src/eclipse_l0/vendor_pilot.py'
      - 'config/vendor_source_registry.json'
      - 'tests/test_vendor_enterprise_batch.py'
      - '.github/workflows/vendor-enterprise-batch2-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eclipse-enterprise-batch2-probe
  cancel-in-progress: false
jobs:
  official-six-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source and registry tests
        run: |
          python -m eclipse_l0.vendor_registry
          python -m unittest discover -s tests -p test_vendor_enterprise_batch.py -v
      - name: Real publisher index to detail bounded live probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from eclipse_l0.vendor_registry import load_registry
          from eclipse_l0.vendor_pilot import OfficialFetch,discover,normalize
          s={x["source_id"]:x for x in load_registry(Path("config/vendor_source_registry.json"))["sources"]}
          ids=["cisco-public-advisories","oracle-security-patches","sap-security-patch-days","vmware-broadcom-vmsa","drupal-core-security","apache-httpd-security"]
          out=[]
          for sid in ids:
              result={"source_id":sid,"status":"FAIL","errors":[]}
              try:
                  get=OfficialFetch(s[sid])
                  items=discover(s[sid],get,1)
                  item=items[0]
                  raw=get.get(item["url"])
                  facts=normalize(s[sid],item,raw)
                  if not isinstance(facts["cve_ids"],list) or facts["affected"]:
                      raise ValueError("Unreviewed CVE relation cannot establish product exposure")
                  result.update(status="LIVE_SAMPLE_PASS",advisory_id=item["id"],
                      detail_url=item["url"],cve_refs=len(facts["cve_ids"]),
                      source_sha256=hashlib.sha256(raw).hexdigest())
              except Exception as e:
                  result["errors"].append(type(e).__name__+": "+str(e)[:230])
              out.append(result)
          receipt={"attempted":len(ids),"passed":sum(x["status"]=="LIVE_SAMPLE_PASS" for x in out),
              "results":out,"main_modified":False,"private_kaggle_modified":False,"production":False}
          Path("output/enterprise-batch2-probe.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(receipt,indent=2,ensure_ascii=False))
          if receipt["passed"]==0:raise SystemExit("All candidates failed; no promotion permitted")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-enterprise-batch2-source-proof
          path: output/enterprise-batch2-probe.json
          retention-days: 7
          if-no-files-found: warn
