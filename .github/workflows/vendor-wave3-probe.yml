name: ECLIPSE wave3 ten official publisher probes (Chrome excluded)
on:
  push:
    branches: [feature/vendor-source-registry-20261010]
    paths:
      - '.github/workflows/vendor-wave3-probe.yml'
      - 'src/eclipse_l0/vendor_wave3_sources.py'
      - 'src/eclipse_l0/vendor_pilot.py'
      - 'config/vendor_source_registry.json'
      - 'tests/test_vendor_wave3_sources.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eclipse-vendor-wave3-probes
  cancel-in-progress: false
jobs:
  bounded-official-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guarded official source synthetic regressions
        run: |
          python -m eclipse_l0.vendor_registry
          python -m unittest discover -s tests -p test_vendor_wave3_sources.py -v
      - name: Publisher live discovery/detail identity and CVE evidence, no storage mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from eclipse_l0.vendor_registry import load_registry
          from eclipse_l0.vendor_pilot import OfficialFetch,discover,normalize
          ss={s["source_id"]:s for s in load_registry(Path("config/vendor_source_registry.json"))["sources"]}
          wanted=["juniper-jsa","hpe-psirt","ibm-security-bulletins","netapp-psirt","jenkins-security","grafana-security","nginx-security","openssl-security","tomcat-security","wordpress-core-security"]
          results=[]
          for sid in wanted:
              src=ss[sid]
              row={"source_id":sid,"status":"FAIL","errors":[]}
              try:
                  get=OfficialFetch(src)
                  items=discover(src,get,1)
                  item=items[0]
                  raw=get.get(item["url"])
                  facts=normalize(src,item,raw)
                  if facts["affected"] or not facts["evidence_fields"]:
                      raise ValueError("Unexpected premature product impact assertion")
                  row.update({"status":"LIVE_SAMPLE_PARSE_PASS","advisory_id":item["id"],
                              "publisher_url":item["url"],"cve_references":len(facts["cve_ids"]),
                              "source_sha256":hashlib.sha256(raw).hexdigest()})
              except Exception as exc:
                  row["errors"].append(type(exc).__name__+": "+str(exc)[:260])
              results.append(row)
          evidence={"candidates":len(wanted),"passed":sum(x["status"]=="LIVE_SAMPLE_PARSE_PASS" for x in results),
                    "per_source":results,"main_unchanged":True,"kaggle_unchanged":True,"production":False}
          Path("output/wave3-probe.json").write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          if evidence["passed"]==0:raise SystemExit("No successful live sample; all sources unverified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-wave3-publication-probes
          path: output/wave3-probe.json
          retention-days: 7
          if-no-files-found: warn
