name: ECLIPSE EPSS daily selected-CVE enrichment (public data)

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-public-state-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: observed
          ref: eclipse-state
          fetch-depth: 1
      - name: Check availability of official KEV watchlist baseline
        id: state
        run: |
          if test -f observed/data/kev-current.json; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'KEV baseline not yet available; skipping EPSS until after successful KEV poll.'
          fi
      - name: Download official EPSS daily gzip (MAX 100 MB)
        if: steps.state.outputs.available == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 \
            'https://epss.empiricalsecurity.com/epss_scores-current.csv.gz' \
            --output downloads/epss-current.csv.gz
          test "$(wc -c < downloads/epss-current.csv.gz)" -le 104857600
      - name: Produce official EPSS enrichment for public KEV identifiers only
        if: steps.state.outputs.available == 'true'
        working-directory: app
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m eclipse_l0.epss \
            --file downloads/epss-current.csv.gz \
            --kev-state ../observed/data/kev-current.json \
            --out ../observed/data/epss-selected.json
      - name: Commit latest public subset; do not commit full EPSS CSV
        if: steps.state.outputs.available == 'true'
        working-directory: observed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/epss-selected.json
          if git diff --cached --quiet; then
            echo 'No EPSS data update.'
          else
            git commit -m 'data: EPSS daily KEV selected scores'
            git push origin HEAD:eclipse-state
          fi
# No customer asset identifiers or private watchlists in this PUBLIC workflow.
