name: ECLIPSE one-shot Kaggle dataset existence diagnosis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-kaggle-status-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - name: Read-only private dataset status and file listing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaggle-diag"
          kaggle datasets init -p "$RUNNER_TEMP/kaggle-diag" >/dev/null
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          meta=json.loads((Path(os.environ['RUNNER_TEMP'])/'kaggle-diag/dataset-metadata.json').read_text())
          ref=meta['id'].replace('INSERT_SLUG_HERE','eclipse-cve-full-20261010-v1')
          print("::add-mask::"+ref,flush=True)
          cmds=[("full_snapshot_status",["kaggle","datasets","status",ref]),
                ("full_snapshot_files",["kaggle","datasets","files",ref,"--page-size","200","--csv"])]
          results={}
          for name,cmd in cmds:
              out=subprocess.run(cmd,capture_output=True,text=True,timeout=35)
              message=(out.stdout+"\n"+out.stderr).lower()
              # Avoid revealing owner/token and provider payload in logs.
              import re,csv,io
              lines=list(csv.reader(io.StringIO(out.stdout))) if name=="full_snapshot_files" else []
              names=[c for row in lines for c in row]
              results[name]={"exit_code":out.returncode,
                "file_rows":len(lines),
                "cve_shards":sum(bool(re.fullmatch(r"\\d{6}-\\d{6}\\.cvepack",n)) for n in names),
                "index_present":("archive-index.json" in names),
                "manifest_present":("manifest.json" in names),
                "http_404":("404" in message or "not found" in message),
                "http_403":("403" in message or "forbidden" in message),
                "http_429":("429" in message or "too many requests" in message),
                "pending":("pending" in message),
                "ready":("ready" in message),
                "error_status":("error" in message)}

          # Minimal verified readback, without requesting a 162-file provider archive.
          import hashlib
          from pathlib import Path
          targets=["archive-index.json","000000-002499.cvepack"]
          for name in targets:
              output=Path(os.environ["RUNNER_TEMP"])/"kaggle-diag"/("probe-"+name.replace(".","-"))
              output.mkdir(parents=True,exist_ok=True)
              try:
                  args=["kaggle","datasets","download",ref,"--file",name,"-p",str(output),"--unzip","--force","--quiet"]
                  p=subprocess.run(args,capture_output=True,text=True,timeout=90)
                  msg=(p.stdout+"\n"+p.stderr).lower()
                  downloaded=output/name
                  results["fetch_"+name]={
                      "exit_code":p.returncode, "present":downloaded.exists(),
                      "bytes":downloaded.stat().st_size if downloaded.exists() else 0,
                      "sha256":hashlib.sha256(downloaded.read_bytes()).hexdigest() if downloaded.exists() else None,
                      "code_403":("403" in msg), "code_404":("404" in msg),
                      "code_429":("429" in msg), "code_500":("500" in msg),
                      "code_502":("502" in msg), "code_503":("503" in msg),
                      "timeout":False
                  }
              except subprocess.TimeoutExpired:
                  results["fetch_"+name]={"timeout":True}
          print(json.dumps(results,sort_keys=True))
          PY
