name: ECLIPSE independent PRIVATE vendor Kaggle generation 2 readback
on:
  push:
    branches: [feature/vendor-source-registry-20261010]
    paths:
      - '.github/workflows/vendor-kaggle-v2-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-on-fresh-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7,<2'
      - name: Recover PRE-UPLOAD trusted ancestor and successor indices
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 2
          mkdir -p "$RUNNER_TEMP/ecl-indices/p" "$RUNNER_TEMP/ecl-indices/n" trusted
          gh run download 38052640331 --repo "$GITHUB_REPOSITORY" \
            --name eclipse-vendor-kaggle-trusted-source-index --dir "$RUNNER_TEMP/ecl-indices/p"
          gh run download 38053669895 --repo "$GITHUB_REPOSITORY" \
            --name eclipse-vendor-v2-trusted-preupload-index --dir "$RUNNER_TEMP/ecl-indices/n"
          mapfile -t parent < <(find "$RUNNER_TEMP/ecl-indices/p" -type f -name vendor-evidence-index.json)
          mapfile -t next < <(find "$RUNNER_TEMP/ecl-indices/n" -type f -name vendor-evidence-v2-index.json)
          test "${#parent[@]}" -eq 1 && test "${#next[@]}" -eq 1 || {
            echo "::error::Trusted GitHub PRE-upload evidence missing"; exit 3;
          }
          cp "${parent[0]}" trusted/vendor-evidence-index.json
          cp "${next[0]}" trusted/vendor-evidence-v2-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          from eclipse_l0.vendor_kaggle_successor import validate
          validate(json.loads(Path("trusted/vendor-evidence-v2-index.json").read_text()),
                   Path("trusted/vendor-evidence-index.json"))
          print("INDEPENDENT_PRE_UPLOAD_ANCESTRY=VERIFIED")
          PY
      - name: Download PRIVATE vendor Kaggle generation 2 without changing v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecl-identity" "$RUNNER_TEMP/ecl-v2-downloaded"
          kaggle datasets init -p "$RUNNER_TEMP/ecl-identity" >/dev/null
          ref="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ecl-identity/dataset-metadata.json"
          value=json.loads(p.read_text())["id"]
          if not isinstance(value,str) or not value.endswith("/INSERT_SLUG_HERE"):
              raise SystemExit("Unexpected Kaggle owner")
          print(value.replace("INSERT_SLUG_HERE","eclipse-vendor-evidence-20261010-v2"))
          PY
          )"
          echo "::add-mask::$ref"
          for name in vendor-evidence-v2-index.json part-0000.dbpart; do
            ok=0
            for attempt in 1 2 3; do
              if kaggle datasets download "$ref" --file "$name" \
                 --path "$RUNNER_TEMP/ecl-v2-downloaded" \
                 --unzip --force --quiet >/dev/null 2>&1 \
                 && test -s "$RUNNER_TEMP/ecl-v2-downloaded/$name"; then
                 ok=1; break
              fi
              sleep 3
            done
            test "$ok" -eq 1 || { echo "::error::Missing Kaggle v2 file $name"; exit 5; }
          done
          python -m eclipse_l0.vendor_kaggle_successor restore \
             --trusted-index trusted/vendor-evidence-v2-index.json \
             --parent-index trusted/vendor-evidence-index.json \
             --downloaded "$RUNNER_TEMP/ecl-v2-downloaded" \
             --dest "$RUNNER_TEMP/ecl-vendor-v2-restored.sqlite3" \
             --registry config/vendor_source_registry.json \
             > "$RUNNER_TEMP/ecl-v2-independent-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"ecl-v2-independent-receipt.json").read_text())
          assert r["result"]=="PRIVATE_VENDOR_GENERATION_2_INDEPENDENTLY_VERIFIED"
          assert r["counts"]["advisories"]>=125
          assert r["counts"]["versions"]>=202
          assert r["verified_sqlite_integrity"]=="ok"
          assert r["prior_history_unchanged"]
          assert r["cve_warehouse_unchanged"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## PRIVATE Kaggle vendor v2 independently recovered\n")
              f.write(f"- Source-linked documents: **{r['counts']['advisories']}**\n")
              f.write(f"- Immutable history versions: **{r['counts']['versions']}**\n")
              f.write("- Parent v1 remains intact. CVE/KEV/EPSS not modified.\n")
              f.write("- Retrieved bytes, independent preupload checksum, source counts and SQLite OK.\n")
          print("INDEPENDENT_PRIVATE_VENDOR_V2_RESTORE=VERIFIED",r["counts"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-private-vendor-v2-independent-restore-proof
          path: ${{ runner.temp }}/ecl-v2-independent-receipt.json
          retention-days: 7
          if-no-files-found: warn
